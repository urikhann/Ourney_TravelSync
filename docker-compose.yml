# One command starts the whole app:   docker compose up --build      ->  http://localhost:5173
# 40 demo places instead of all 3,570:  PLACES_FILE=travelsync_demo40.csv PLACES_VERSION=busan-demo40-v1 docker compose up
# Stop: Ctrl+C (or docker compose down).  Delete all data and start fresh: docker compose down -v
# Settings come from .env (optional, copy .env.example); the defaults below work without it.
x-places: &places
  PLACES_CSV: /data/${PLACES_FILE:-travelsync_poi_metadata_enriched_v3.csv}
  PLACES_VERSION: ${PLACES_VERSION:-busan-enriched-v3}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travelsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelsync}
      POSTGRES_DB: ${POSTGRES_DB:-travelsync}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travelsync} -d ${POSTGRES_DB:-travelsync}"]
      interval: 3s
      retries: 20

  recommender:  # Urikhan — the team package (GFAR / AWM) behind contracts/recommend.*.json
    build: {context: ., dockerfile: services/recommender/Dockerfile}
    environment:
      <<: *places
      DATASET_VERSION: ${PLACES_VERSION:-busan-enriched-v3}
      TRAVELSYNC_E5_CACHE: /e5-cache
      TRAVELSYNC_E5_MODEL_CACHE: /e5-models
    ports: ["8002:8002"]
    volumes: ["./src/ourney_travelsync/data:/data:ro", "./output/e5-cache:/e5-cache", "./output/e5-models:/e5-models"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      retries: 20

  optimizer:
    build: {context: ., dockerfile: services/optimizer/Dockerfile}
    ports: ["127.0.0.1:8003:8003"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 5s
      retries: 20

  mocks:  # availability checker and AI agent stand-ins; never used for production planning
    build: ./services/mocks
    environment:
      PYTHONPATH: /package/src
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-travelsync}:${POSTGRES_PASSWORD:-travelsync}@db:5432/${POSTGRES_DB:-travelsync}
    ports: ["8001:8001"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./services/mocks:/code", "./src:/package/src:ro"]

  api:  # Bat — backend
    build: {context: ., dockerfile: api/Dockerfile}
    env_file: [{path: .env, required: false}]
    environment:
      <<: *places
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-travelsync}:${POSTGRES_PASSWORD:-travelsync}@db:5432/${POSTGRES_DB:-travelsync}
      HOURS_CSV: /data/travelsync_poi_operating_info_v1.csv
      PLACES_FOLLOW_ENV: "true"   # import / activate PLACES_VERSION on start, so switching to the demo pool just works
      RECOMMENDER_URL: http://recommender:8002
      OPTIMIZER_URL: http://optimizer:8003
      PLANNING_DATA_URL: ${PLANNING_DATA_URL:-}
      PLANNING_DATA_TOKEN: ${PLANNING_DATA_TOKEN:-}
      PLANNING_DATA_TIMEOUT_SECONDS: ${PLANNING_DATA_TIMEOUT_SECONDS:-20}
      OPTIMIZER_TIMEOUT_SECONDS: "45"
      AVAILABILITY_URL: http://mocks:8001
      AGENT_URL: http://mocks:8001
      FEATURE_AVAILABILITY: ${FEATURE_AVAILABILITY:-true}
      WEB_ORIGIN: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      recommender: {condition: service_healthy}
      optimizer: {condition: service_healthy}
    volumes: ["./api/app:/code/app", "./src/ourney_travelsync/data:/data:ro"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 60   # the first start imports 3,570 places + opening hours

  web:  # Bat — web app
    image: node:22
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on:
      api: {condition: service_healthy}
    volumes: ["./web:/web", "/web/node_modules"]

volumes:
  pgdata:
