name: Itinerary optimizer
on: [push, pull_request]
jobs:
  optimizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.13'}
      - run: uv sync --locked --extra optimizer
      # Root tests include the planning-data adapter and its database imports.
      - run: uv pip install -r services/optimizer/requirements.txt -r services/planning_data/requirements.txt
      - run: uv run --no-sync python -m pytest -q tests
