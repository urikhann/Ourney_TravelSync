[project]
name = "ourney-travelsync"
version = "0.1.0"
description = "TravelSync group recommendations, POI ingestion, and versioned PostgreSQL storage"
readme = "README.md"
authors = [
    { name = "Urikhan Purevjav", email = "140320983+urikhann@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = ["numpy>=2.1"]

[project.scripts]
ourney-travelsync = "ourney_travelsync.cli:main"

[project.optional-dependencies]
ingestion = ["requests", "pandas"]
postgres = ["psycopg[binary]", "python-dotenv"]
viewer = ["streamlit", "altair", "pandas", "psycopg[binary]", "python-dotenv"]
experiments = ["mlflow", "dvc"]

[dependency-groups]
dev = ["pytest", "ipykernel"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["database/**", "docs/**", "apps/**", "scripts/**", "notebooks/**", "tests/**", "integration_tests/**", ".github/**", ".env.example", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
